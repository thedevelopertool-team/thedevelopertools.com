<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .bg  { fill: #171717; }
    .fg  { stroke: #ffffff; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #ffffff; }
      .fg  { stroke: #171717; }
      .dot { fill: #171717; }
    }
  </style>
  <!-- Rounded square background -->
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Left bracket < -->
  <polyline class="fg" points="12,10 7,16 12,22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket > -->
  <polyline class="fg" points="20,10 25,16 20,22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash / -->
  <line class="fg" x1="18" y1="9" x2="14" y2="23" stroke-width="2" stroke-linecap="round"/>
</svg>
